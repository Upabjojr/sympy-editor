name: Web app

# Builds the web app (webapp/build.py), to know that it builds, and keeps
# what it built as the run's artifact.  It publishes nothing: the site at
# https://upabjojr.github.io/sympy-editor/ is the shelf (`python
# webapp/build.py --shelf DIR`, see the README) and lives in the
# Upabjojr.github.io repository.  Pages for this repository would be served
# at that same address and hide it, so they are left off - which is why a
# deploy step here only ever failed.

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths: ["src/**", "mobile/build_www.py", "webapp/**", ".github/workflows/webapp.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # The add-ons' own requirements: the site starts with them switched
      # on, and switching one on here imports it.  Without these the build
      # still succeeds - it says which stayed off - but the site would open
      # with two of the four rather than all of them.
      - run: pip install -e . "lark>=1.1" "sympy-matching>=0.0.4"
      - run: python webapp/build.py --out webapp/dist
      - uses: actions/upload-artifact@v4
        with: { name: webapp, path: webapp/dist }
