name: CI

on:
  push:
  pull_request:

# The jobs read the repository and nothing else: no job publishes, tags or
# comments, so the token they are handed can do none of it either.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The bundled add-ons' own packages, so that the tests of a site that
      # opens with all four on can see all four.
      - run: pip install -e ".[jupyter,test]" "lark>=1.1" "sympy-matching>=0.0.4"
      - run: pytest -q --ignore=tests/test_browser.py

  # The oldest SymPy pyproject.toml admits (the matrix above always gets the
  # latest release, so an import that only exists there would go unnoticed).
  oldest-sympy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[jupyter,test]" "sympy==1.14.*" "lark>=1.1" "sympy-matching>=0.0.4"
      - run: pytest -q --ignore=tests/test_browser.py

  # Every test that drives a page, not only test_browser.py: the other
  # modules skip without Playwright, so the jobs above never run them.
  # No add-on is installed here, as after a plain `pip install sympy-editor`.
  # The browser is what this job is for, so a test that would skip for want
  # of it - no Chromium, the CDN out of reach for the one request made while
  # the tests are collected - fails instead (tests/conftest.py): the job was
  # green having run nothing.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[jupyter,test]" playwright
      - run: python -m playwright install --with-deps chromium
      - run: pytest -q tests/
        env:
          SYMPY_EDITOR_SLOW_TESTS: "1"
          SYMPY_EDITOR_REQUIRE_BROWSER: "1"

  # The add-ons' own suites (unit and Playwright), each add-on a folder of
  # addons/ that its tests put on the path.  The handwriting model lives in
  # a repository of its own: the two tests that read real ink skip without it.
  addons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[jupyter,test]" playwright "lark>=1.1" "sympy-matching>=0.0.4" numpy onnxruntime
      - run: python -m playwright install --with-deps chromium
      # As in the browser job, a browser test that skips must not pass for a
      # run.  tests/conftest.py, which refuses such a skip, is not read for
      # addons/: until the conftest at the root does the same, the skips are
      # listed (-rs) and looked through here.
      - shell: bash
        env:
          SYMPY_EDITOR_REQUIRE_BROWSER: "1"
        run: |
          pytest -q -rs addons/ | tee "$RUNNER_TEMP/addons.txt"
          if grep -iE "^SKIPPED .*(playwright|chromium|CDN)" "$RUNNER_TEMP/addons.txt"; then
            echo "::error::the add-ons' browser tests were skipped: no browser, or no CDN"
            exit 1
          fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: |
          pip install dist/*.whl
          python -c "import sympy_editor, sympy; print(sympy_editor.to_html(sympy.Symbol('x'))[:40])"
