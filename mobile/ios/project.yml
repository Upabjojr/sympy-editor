# XcodeGen spec (brew install xcodegen; xcodegen generate) - see mobile/README.md
#
# Python.xcframework, app/ and app_packages/ are build products, staged by
# mobile/build.py (they are not in the repository): the interpreter, the
# app's Python, and SymPy.
name: SymPyEditor
options:
  bundleIdPrefix: org.sympy
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  SymPyEditor:
    type: application
    platform: iOS
    sources:
      - path: SymPyEditor        # includes Assets.xcassets, built by mobile/make_icons.py
      - path: ../www          # the shared bundle, copied into the app as a folder
        type: folder
        buildPhase: resources
      - path: app             # sympy_editor_app.py and the sympy_editor package
        type: folder
        buildPhase: resources
      - path: app_packages    # SymPy and mpmath
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Python.xcframework
        embed: true
        codeSign: true
    info:
      path: SymPyEditor/Info.plist
      properties:
        CFBundleDisplayName: SymPy editor
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: ${IOS_BUILD_NUMBER}
        # No cryptography of the app's own, and no OpenSSL either (see the
        # build phase): the store's export-compliance question is answered here.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: org.sympy.editor
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ${IOS_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        SWIFT_OBJC_BRIDGING_HEADER: SymPyEditor/SymPyEditor-Bridging-Header.h
        # The stdlib's extension modules are loaded from the app bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # The standard library cannot live inside an XCFramework, so the support
      # package ships this: it copies the stdlib for the slice being built into
      # the app and turns every .so into the .framework iOS insists on.  Runs
      # after the resources are in place, which is what it expects.
      - name: Process Python libraries
        basedOnDependencyAnalysis: false
        script: |
          set -e
          # An unsigned build (the simulator, CODE_SIGNING_ALLOWED=NO) still has
          # to sign the frameworks this makes: ad-hoc is what the simulator wants.
          export EXPANDED_CODE_SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          source "$PROJECT_DIR/Python.xcframework/build/utils.sh"
          # install_python, in its three steps, with one thing between them:
          # _ssl and _hashlib go, before they become frameworks.  They carry
          # OpenSSL, which App Store review takes for a third-party SDK that
          # must bring a privacy manifest (ITMS-91061); the app never opens a
          # socket, and hashlib has CPython's own digests (_md5, _sha2...) to
          # fall back on.
          install_stdlib Python.xcframework
          PYTHON_VER=$(ls -1 "$CODESIGNING_FOLDER_PATH/python/lib" | grep -E "^python3\.[0-9]+$")
          rm -rf "$CODESIGNING_FOLDER_PATH/python/lib/$PYTHON_VER/lib-dynload"/_ssl.* \
                 "$CODESIGNING_FOLDER_PATH/python/lib/$PYTHON_VER/lib-dynload"/_hashlib.* \
                 "$CODESIGNING_FOLDER_PATH/Frameworks"/_ssl.framework \
                 "$CODESIGNING_FOLDER_PATH/Frameworks"/_hashlib.framework
          for folder in python/lib/$PYTHON_VER/lib-dynload app app_packages; do
            process_dylibs Python.xcframework $folder
          done
