# XcodeGen spec (brew install xcodegen; xcodegen generate) - see mobile/README.md
name: SymPyEditor
options:
  bundleIdPrefix: org.sympy
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  SymPyEditor:
    type: application
    platform: iOS
    sources:
      - path: SymPyEditor        # includes Assets.xcassets, built by mobile/make_icons.py
      - path: ../www          # the shared bundle, copied into the app as a folder
        type: folder
        buildPhase: resources
    info:
      path: SymPyEditor/Info.plist
      properties:
        CFBundleDisplayName: SymPy editor
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: org.sympy.editor
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ${IOS_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
