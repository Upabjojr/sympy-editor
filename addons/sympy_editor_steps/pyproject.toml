[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sympy-editor-steps"
version = "0.0.1"
description = "sympy-editor add-on: step-by-step solutions (integrals, derivatives, simple equations)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }   # as sympy-editor: see its LICENSE
dependencies = ["sympy-editor"]

[project.entry-points."sympy_editor.addons"]
steps = "sympy_editor_steps:ADDON"

[tool.setuptools.packages.find]
include = ["sympy_editor_steps*"]

[tool.setuptools.package-data]
sympy_editor_steps = ["static/*"]
