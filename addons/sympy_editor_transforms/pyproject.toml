[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sympy-editor-transforms"
version = "0.0.1"
description = "sympy-editor add-on: Laplace, Fourier, Mellin, Hankel and z-transforms of the selection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }   # as sympy-editor: see its LICENSE
dependencies = ["sympy-editor"]

[project.entry-points."sympy_editor.addons"]
transforms = "sympy_editor_transforms:ADDON"

[tool.setuptools.packages.find]
include = ["sympy_editor_transforms*"]

[tool.setuptools.package-data]
sympy_editor_transforms = ["static/*"]
