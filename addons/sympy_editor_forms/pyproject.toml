[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sympy-editor-forms"
version = "0.0.1"
description = "sympy-editor add-on: the selection rewritten by every SymPy simplification function, side by side"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }   # as sympy-editor: see its LICENSE
dependencies = ["sympy-editor"]

[project.entry-points."sympy_editor.addons"]
forms = "sympy_editor_forms:ADDON"

[tool.setuptools.packages.find]
include = ["sympy_editor_forms*"]

[tool.setuptools.package-data]
sympy_editor_forms = ["static/*"]
