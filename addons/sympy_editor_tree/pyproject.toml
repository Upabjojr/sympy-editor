[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sympy-editor-tree"
version = "0.0.1"
description = "sympy-editor add-on: the expression tree as an editable graph"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
dependencies = ["sympy-editor"]

[project.entry-points."sympy_editor.addons"]
tree = "sympy_editor_tree:ADDON"

[tool.setuptools.packages.find]
include = ["sympy_editor_tree*"]

[tool.setuptools.package-data]
sympy_editor_tree = ["static/*"]
