[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sympy-editor-numeric"
version = "0.0.1"
description = "sympy-editor add-on: the selection evaluated numerically, as a value or a table"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }   # as sympy-editor: see its LICENSE
dependencies = ["sympy-editor"]

[project.entry-points."sympy_editor.addons"]
numeric = "sympy_editor_numeric:ADDON"

[tool.setuptools.packages.find]
include = ["sympy_editor_numeric*"]

[tool.setuptools.package-data]
sympy_editor_numeric = ["static/*"]
