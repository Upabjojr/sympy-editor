[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sympy-editor-handwriting"
version = "0.0.1"
description = "sympy-editor add-on: write a formula by hand, read by math-ocr's stroke model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }   # unlike sympy-editor and its other add-ons (BSD-3-Clause): see LICENSE
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)"]
# The model itself is not a dependency pip can meet: a math-ocr checkout (see README.md).
dependencies = ["sympy-editor", "sympy-editor-latex", "numpy", "onnxruntime"]

[project.entry-points."sympy_editor.addons"]
handwriting = "sympy_editor_handwriting:ADDON"

[tool.setuptools.packages.find]
include = ["sympy_editor_handwriting*"]

[tool.setuptools.package-data]
sympy_editor_handwriting = ["static/*"]
