[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sympy-editor-feynman"
version = "0.0.1"
description = "sympy-editor add-on: path integrals of QED expanded into Feynman diagrams"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
dependencies = ["sympy-editor"]

[project.entry-points."sympy_editor.addons"]
feynman = "sympy_editor_feynman:ADDON"

[tool.setuptools.packages.find]
include = ["sympy_editor_feynman*"]

[tool.setuptools.package-data]
sympy_editor_feynman = ["static/*"]
