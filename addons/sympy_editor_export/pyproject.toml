[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sympy-editor-export"
version = "0.0.1"
description = "sympy-editor add-on: the formula written out as LaTeX, MathML, Python, C, Fortran, JavaScript, Octave, Julia, Rust or a whole function"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }   # as sympy-editor: see its LICENSE
dependencies = ["sympy-editor"]

[project.entry-points."sympy_editor.addons"]
export = "sympy_editor_export:ADDON"

[tool.setuptools.packages.find]
include = ["sympy_editor_export*"]

[tool.setuptools.package-data]
sympy_editor_export = ["static/*"]
