[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sympy-editor-linalg"
version = "0.0.1"
description = "sympy-editor add-on: a linear algebra workbench for the selected matrix"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }   # as sympy-editor: see its LICENSE
dependencies = ["sympy-editor"]

[project.entry-points."sympy_editor.addons"]
linalg = "sympy_editor_linalg:ADDON"

[tool.setuptools.packages.find]
include = ["sympy_editor_linalg*"]

[tool.setuptools.package-data]
sympy_editor_linalg = ["static/*"]
