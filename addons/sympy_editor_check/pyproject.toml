[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sympy-editor-check"
version = "0.0.1"
description = "sympy-editor add-on: checks that each step of the history is equivalent to the one before"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }   # as sympy-editor: see its LICENSE
dependencies = ["sympy-editor"]

[project.entry-points."sympy_editor.addons"]
check = "sympy_editor_check:ADDON"

[tool.setuptools.packages.find]
include = ["sympy_editor_check*"]

[tool.setuptools.package-data]
sympy_editor_check = ["static/*"]
